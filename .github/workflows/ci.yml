name: CI

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  tools: composer:v2
              env:
                  # This is needed to install Xdebug on PHP 8.4+
                  XDEBUG_VERSION: 3.3.2

            - name: Validate composer.json and composer.lock
              run: composer validate --strict

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Cache Composer packages
              id: composer-cache
              uses: actions/cache@v3
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-

            - name: Run tests
              run: php ./vendor/bin/pest --parallel --stop-on-failure

            - name: Generate changelog
              id: changelog
              run: |
                # Get the last tag
                LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

                if [ -z "$LAST_TAG" ]; then
                    # No previous tags, get all commits
                    COMMITS=$(git log --pretty=format:"- %s" | head -20)
                else
                    # Get commits since last tag
                    COMMITS=$(git log $LAST_TAG..HEAD --pretty=format:"- %s")
                fi

                # Store in output, handling multiline
                echo "commits<<EOF" >> $GITHUB_OUTPUT
                echo "$COMMITS" >> $GITHUB_OUTPUT
                echo "EOF" >> $GITHUB_OUTPUT

            - name: Bump version
              id: version
              run: |
                LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.3.0")

                # Split version and increment minor version
                IFS='.' read -r major minor patch <<< "$LAST_TAG"
                minor=$((minor + 1))
                NEXT_VERSION="$major.$minor.0"

                echo "Current version: $CURRENT_VERSION"
                echo "Next version: $NEXT_VERSION"
                echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                body: ${{ steps.changelog.outputs.commits }}
                draft: false
                prerelease: false
                tag_name: "${{ steps.version.outputs.version }}"
